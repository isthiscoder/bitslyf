title: Bitslyf
description: Research log on industries, workflows and predictions.
author: Siddharth singh
email: "isidd.dev@gmail.com"
url: "https://bitslyf.com"

collections:
  essays:
    output: true
    permalink: /essays/:name/
  predictions:
    output: true
    permalink: /predictions/:name/

defaults:
  - scope: { path: "", type: "essays" }
    values: { layout: "essay" }
  - scope: { path: "", type: "predictions" }
    values: { layout: "prediction", layer: "prediction" }

social:
  twitter: "https://x.com/bitslyf"
  linkedin: "https://www.linkedin.com/company/bitslyf"
  instagram: "https://www.instagram.com/bitslyf"

exclude: [README.md, Gemfile, Gemfile.lock, vendor]
plugins: []
