---
layout: default
---
<div class="wrap col feed">
  <div class="filterhead">
    <h1>{{ page.title }}</h1>
    <p>{{ page.blurb }}</p>
  </div>

  {% assign items = site.documents | where: "layer", page.layer | sort: "date" | reverse %}
  <div class="entries" id="entries">
    {% include entries.html items=items %}
  </div>
  <p class="empty" id="empty" hidden>Nothing matches that search.</p>

  {% if page.layer == "prediction" %}{% include tally.html %}{% endif %}
</div>
