<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Bitslyf</a>

    {% if page.url == "/" %}
    <div class="filter">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="q" class="visually-hidden">Search entries</label>
      <input id="q" type="search" placeholder="Search by title, tag or date" autocomplete="off">
    </div>
    {% else %}
    <span></span>
    {% endif %}

    <nav>
      <a href="{{ '/#analysis'    | relative_url }}">Analysis</a>
      <a href="{{ '/#research'    | relative_url }}">Research</a>
      <a href="{{ '/#prediction'  | relative_url }}">Predictions</a>
      <a href="{{ '/#thesis'      | relative_url }}">Thesis</a>
      <a href="{{ '/about/'       | relative_url }}">About</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <div class="social">
      <a href="{{ site.social.twitter }}" aria-label="Twitter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.95 4.57a10 10 0 0 1-2.83.78 4.93 4.93 0 0 0 2.17-2.72c-.95.56-2 .97-3.13 1.19a4.92 4.92 0 0 0-8.39 4.49A13.97 13.97 0 0 1 1.64 3.16a4.92 4.92 0 0 0 1.52 6.57 4.9 4.9 0 0 1-2.23-.61v.06a4.92 4.92 0 0 0 3.95 4.83 4.96 4.96 0 0 1-2.21.08 4.93 4.93 0 0 0 4.6 3.42A9.87 9.87 0 0 1 0 19.54a13.94 13.94 0 0 0 7.55 2.21c9.06 0 14-7.5 14-14 0-.21 0-.42-.02-.63a9.94 9.94 0 0 0 2.42-2.55z"/></svg>
      </a>
      <a href="{{ site.social.linkedin }}" aria-label="LinkedIn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.59 0 4.26 2.37 4.26 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
      </a>
      <a href="{{ site.social.instagram }}" aria-label="Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.2"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="mailto:{{ site.email }}" aria-label="Email">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.2 4h17.6A1.2 1.2 0 0 1 22 5.2v13.6a1.2 1.2 0 0 1-1.2 1.2H3.2A1.2 1.2 0 0 1 2 18.8V5.2A1.2 1.2 0 0 1 3.2 4z"/><path d="M3 6.2 12 13l9-6.8" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
    <span class="copyline">© {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</span>
  </div>
</footer>

{% if page.url == "/" %}<script src="{{ '/assets/js/site.js' | relative_url }}"></script>{% endif %}
</body>
</html>
